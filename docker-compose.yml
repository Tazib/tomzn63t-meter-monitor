# docker compose up -d --build
# Reads secrets from .env (see .env.example and DEPLOY.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smarthome
      POSTGRES_DB: smarthome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome -d smarthome"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: smarthome-energy:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://smarthome:${POSTGRES_PASSWORD}@db:5432/smarthome
    # Only Nginx on the host talks to the app.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  poller:
    image: smarthome-energy:latest
    restart: unless-stopped
    command: ["npm", "run", "poller"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://smarthome:${POSTGRES_PASSWORD}@db:5432/smarthome
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  pgdata:
